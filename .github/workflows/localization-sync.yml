name: Localization Sync

# Default behavior: open a PR with the synced locale files for review.
# To push straight to `dev` instead (no review step), flip LOCALIZATION_DIRECT_COMMIT
# below to "true".
on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: localization-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  LOCALIZATION_DIRECT_COMMIT: "false"

jobs:
  sync-locales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install translator
        run: |
          uv venv tools/localization/.venv
          uv pip install --python tools/localization/.venv deep-translator

      - name: Sync all languages with en.lua
        run: |
          tools/localization/.venv/bin/python tools/localization/sync_locale.py all --revalidate

      - name: Check for changes
        id: git-check
        run: |
          git diff --stat -- scripts/locales/
          if git diff --quiet -- scripts/locales/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true' && env.LOCALIZATION_DIRECT_COMMIT != 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "i18n: sync all languages with en.lua"
          branch: i18n/auto-sync
          delete-branch: true
          title: "i18n: automated locale sync"
          body: |
            Automated nightly sync of `scripts/locales/*.lua` against the `en.lua`
            reference, generated by `tools/localization/sync_locale.py all --revalidate`.

            Machine translation is a starting point — please review before merging,
            especially the `cn` / `jp` / `ko` files.
          add-paths: |
            scripts/locales/*.lua

      - name: Commit and push directly
        if: steps.git-check.outputs.changed == 'true' && env.LOCALIZATION_DIRECT_COMMIT == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/locales/*.lua
          git commit -m "i18n: sync all languages with en.lua"
          git push
