name: E2E Tests

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install JS deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # NOTE: assumes a prebuilt ntop/ntopng Docker image is available and
      # kept in sync with this branch. If no such image is published yet,
      # replace this step with a build-from-source job (see .github/workflows/build.yml
      # for the equivalent native build steps) before enabling this workflow.
      - name: Start ntopng
        run: |
          docker run -d --name ntopng -p 3000:3000 ntop/ntopng:latest -i lo
          timeout 60 bash -c 'until curl -sf http://localhost:3000/lua/login.lua; do sleep 2; done'

      - name: Run smoke tests
        env:
          NTOPNG_URL: http://localhost:3000
          NTOPNG_USER: admin
          NTOPNG_PASSWORD: admin
          NTOPNG_IFID: 1
        run: npm run test:e2e:smoke

      - name: Run consistency tests
        env:
          NTOPNG_URL: http://localhost:3000
          NTOPNG_USER: admin
          NTOPNG_PASSWORD: admin
        run: npm run test:e2e:consistency

      - name: Run flow tests
        env:
          NTOPNG_URL: http://localhost:3000
          NTOPNG_USER: admin
          NTOPNG_PASSWORD: admin
          NTOPNG_IFID: 1
        run: npm run test:e2e:flows

      - name: Upload report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            tests/e2e/report/
            tests/e2e/results/
          retention-days: 14

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/results/**/*.zip
          retention-days: 7
